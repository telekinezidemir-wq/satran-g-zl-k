# iPhone uygulamasını GitHub'ın Mac sunucusunda imzasız derler ve .ipa dosyası üretir.
# Çalıştırmak: GitHub'da depo → Actions → "iPhone uygulamasını derle" → Run workflow.
name: iPhone uygulamasını derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Apple Silicon (macos-26) kuyruğu kapasite nedeniyle dolu olabiliyor; Intel Mac daha boş.
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: XcodeGen kur ve projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild \
            -project SatrancGozluk.xcodeproj \
            -scheme SatrancGozluk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Derleme hataları (başarısızsa)
        if: failure()
        run: grep -E "error:" build.log | head -60 || tail -80 build.log

      - name: .ipa paketle
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Uygulama: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SatrancGozluk.ipa Payload
          ls -la SatrancGozluk.ipa

      - name: .ipa dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: SatrancGozluk-ipa
          path: SatrancGozluk.ipa
          retention-days: 14

      - name: Derleme kaydını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
